<svg xmlns="http://www.w3.org/2000/svg" width="960" height="590" viewBox="0 0 960 590" role="img" aria-labelledby="title description">
<title id="title">From Hays breeding stocks to Indian hybrids</title><desc id="description">Two separate paths: Hays AKM/BKM 2221 stocks to ICRISAT 842A and 842B, with 842A used as seed parent of HHB 68, released in 1993. Hays AKM/BKM 2068 stocks to ICRISAT 843A and 843B, with 843A used as seed parent of HHB 67, released in 1990. Each hybrid also has a separate pollen parent.</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#7c8d6e"/></marker></defs>
<style>text{fill:#293f35;font-family:Arial,sans-serif}.title{font:30px Georgia,serif}.name{font:22px Georgia,serif}.small{font-size:13px;fill:#64725b}.label{font-size:11px;letter-spacing:1.4px;fill:#4d6950}</style>
<rect width="100%" height="100%" fill="#f8f6ee"/>
<text x="32" y="44" class="title" text-anchor="start">From Hays breeding stocks to Indian hybrids</text><text x="32" y="73" class="small" text-anchor="start">D. J. Andrews introduced both sets of Hays stocks to ICRISAT in 1980.</text><text x="32" y="115" class="label" text-anchor="start">HAYS, KANSAS</text><text x="356" y="115" class="label" text-anchor="start">ICRISAT, INDIA</text><text x="680" y="115" class="label" text-anchor="start">HARYANA, INDIA</text><rect x="32" y="137" width="248" height="143" rx="4" fill="#fffdf8" stroke="#d9dfce"/><path d="M32 138H280" stroke="#977028" stroke-width="3"/><rect x="356" y="137" width="248" height="143" rx="4" fill="#fffdf8" stroke="#d9dfce"/><path d="M356 138H604" stroke="#977028" stroke-width="3"/><rect x="680" y="137" width="248" height="143" rx="4" fill="#fffdf8" stroke="#d9dfce"/><path d="M680 138H928" stroke="#977028" stroke-width="3"/><text x="50" y="172" class="name" text-anchor="start">Bill’s breeding stocks</text><text x="50" y="203" class="small" text-anchor="start">AKM 2221 / BKM 2221</text><text x="50" y="239" class="small" text-anchor="start">Developed at the Fort Hays station</text><text x="374" y="172" class="name" text-anchor="start">842A / 842B</text><text x="374" y="203" class="small" text-anchor="start">Further selection for</text><text x="374" y="223" class="small" text-anchor="start">downy mildew resistance</text><text x="374" y="255" class="small" text-anchor="start">842A: seed parent · 842B: maintainer</text><text x="698" y="172" class="name" text-anchor="start">HHB 68</text><text x="698" y="203" class="small" text-anchor="start">842A × a separate pollen parent</text><text x="698" y="239" class="small" text-anchor="start">Released in India in 1993</text><path d="M288 207H346" stroke="#7c8d6e" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M612 207H670" stroke="#7c8d6e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="32" y="309" width="248" height="143" rx="4" fill="#fffdf8" stroke="#d9dfce"/><path d="M32 310H280" stroke="#4d6950" stroke-width="3"/><rect x="356" y="309" width="248" height="143" rx="4" fill="#fffdf8" stroke="#d9dfce"/><path d="M356 310H604" stroke="#4d6950" stroke-width="3"/><rect x="680" y="309" width="248" height="143" rx="4" fill="#fffdf8" stroke="#d9dfce"/><path d="M680 310H928" stroke="#4d6950" stroke-width="3"/><text x="50" y="344" class="name" text-anchor="start">Bill’s breeding stocks</text><text x="50" y="375" class="small" text-anchor="start">AKM 2068 / BKM 2068</text><text x="50" y="411" class="small" text-anchor="start">Developed at the Fort Hays station</text><text x="374" y="344" class="name" text-anchor="start">843A / 843B</text><text x="374" y="375" class="small" text-anchor="start">Further selection for</text><text x="374" y="395" class="small" text-anchor="start">downy mildew resistance</text><text x="374" y="427" class="small" text-anchor="start">843A: seed parent · 843B: maintainer</text><text x="698" y="344" class="name" text-anchor="start">HHB 67</text><text x="698" y="375" class="small" text-anchor="start">843A × a separate pollen parent</text><text x="698" y="411" class="small" text-anchor="start">Released in India in 1990</text><path d="M288 379H346" stroke="#7c8d6e" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M612 379H670" stroke="#7c8d6e" stroke-width="1.5" marker-end="url(#arrow)"/><text x="32" y="503" class="name" text-anchor="start">Reading the letters</text><text x="32" y="532" class="small" text-anchor="start">A lines produce no functional pollen. B lines maintain the matching A line for future seed production.</text><text x="32" y="555" class="small" text-anchor="start">The hybrids were developed at CCS Haryana Agricultural University using A lines as seed parents.</text><a href="https://nwsteg.github.io/assets/2026-10-15-william-stegmeier/sources/research/02_Pearl_Millet_Research/1998_Pearl_Millet_Parental_Lines_842A_842B_EXCERPT.pdf#page=1"><text x="32" y="578" class="small" text-anchor="start">Source: 842A/B paper, ISMN 39 (1998), p. 128</text></a><a href="https://nwsteg.github.io/assets/2026-10-15-william-stegmeier/sources/research/02_Pearl_Millet_Research/1998_Pearl_Millet_Parental_Lines_843A_843B_EXCERPT.pdf#page=1"><text x="390" y="578" class="small" text-anchor="start">Source: 843A/B paper, pp. 129–130</text></a></svg>
